<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>TRIBES</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- Touch controls -->
    <div id="controls">
      <div id="dpad">
        <button class="dbtn" data-k="up">▲</button>
        <div class="drow">
          <button class="dbtn" data-k="left">◀</button>
          <button class="dbtn mid" data-k="down">▼</button>
          <button class="dbtn" data-k="right">▶</button>
        </div>
      </div>
      <div id="actions">
        <button class="abtn" data-k="b">B</button>
        <button class="abtn primary" data-k="a">A</button>
      </div>
    </div>

    <div id="loading">Awakening the tribe…</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
